[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-zotero-insert"
version = "3.1.0"
description = "Insert and audit Zotero citation fields in DOCX documents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["python-docx>=0.8.11", "lxml>=4.6.0", "requests>=2.28.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Markup :: XML",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff==0.17.3"]

[project.scripts]
reverse-zotero-insert = "reverse_zotero_insert.docx_audit:cli"

[project.urls]
Homepage = "https://github.com/hmbbjack/reverse-zotero-insert"
Issues = "https://github.com/hmbbjack/reverse-zotero-insert/issues"
Releases = "https://github.com/hmbbjack/reverse-zotero-insert/releases"

[tool.setuptools]
packages = ["reverse_zotero_insert"]
package-dir = {reverse_zotero_insert = "."}
include-package-data = false

[tool.setuptools.package-data]
reverse_zotero_insert = ["config.example.env", "SKILL.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
